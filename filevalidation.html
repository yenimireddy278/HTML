<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <h1> Registration</h1>

    <form>

        <label>Name</label>
        

        <input
            type="text"
            id="name"
            name="name"
            required
            minlength="3"
            maxlength="38">

        <br><br>

        <label>Email:</label>
            
     

        <input
            type="email"
          
            name="email"
            required>

        <br><br>

        <label>
            Password:
        </label>

        <input
            type="password"
          
            name="password"
            required
            maxlength="8">

        <br><br>

        <label>
            Age:
        </label>

        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required>

        <br><br>

        <label>phone:</label>

        <input
            type="tel"
            name="phone"
            pattern="[0-9]{10}
            required
            placeholder="10 digit number">
            <br><br>
            <button type=""sumbit">
            Submit
        </button>
    </form>
</body>
</html>
